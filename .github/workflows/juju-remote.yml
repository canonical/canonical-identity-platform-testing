# Remote charmed-deployment drift gate — design: docs/ci-spec.md.
# Scheduled runs target vars.CI_JUJU_ENVIRONMENT and are always plan-only;
# attach-apply is dispatch-only, behind the environment's ALLOW_ATTACH_APPLY.
name: Juju drift gate

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target GitHub environment (empty = CI_JUJU_ENVIRONMENT)'
        type: environment
        required: false
      row:
        description: Matrix row to compare the deployment against
        type: string
        required: false
        default: 'core'
      mode:
        description: 'plan-only = zero mutation; attach-apply MUTATES the deployment'
        type: choice
        options: ['plan-only', 'attach-apply']
        default: 'plan-only'

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      row: ${{ steps.pick.outputs.row }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CFG_ENV: ${{ vars.CI_JUJU_ENVIRONMENT }}
          IN_ENV: ${{ inputs.environment }}
          IN_ROW: ${{ inputs.row }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          env_name="${IN_ENV:-$CFG_ENV}"
          if [ -z "$env_name" ]; then
            echo "::error::no target: set the repo variable CI_JUJU_ENVIRONMENT (docs/ci-spec.md §5) or pass the environment input"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            row="${IN_ROW:-core}"; mode="${IN_MODE:-plan-only}"
          else
            row="core"; mode="plan-only"
          fi
          {
            echo "environment=$env_name"
            echo "row=$row"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  drift:
    name: ${{ needs.resolve.outputs.mode }} (${{ needs.resolve.outputs.environment }}, row ${{ needs.resolve.outputs.row }})
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: juju-remote-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      # controller-guard contract: `juju show-controller` must resolve to `jimm`
      JUJU_CONTROLLER: jimm
      MATRIX_ALLOWED_CONTROLLER: jimm
      MATRIX_JUJU_MODEL: ${{ vars.MATRIX_IAM_MODEL }}
      MATRIX_JUJU_CORE_MODEL: ${{ vars.MATRIX_CORE_MODEL }}
      # same service account for the CLI (juju/juju#20716) and terraform;
      # TF_VAR_* instead of JUJU_CONTROLLER_ADDRESSES, which the guard refuses
      JUJU_CLIENT_ID: ${{ secrets.JIMM_CLIENT_ID }}
      JUJU_CLIENT_SECRET: ${{ secrets.JIMM_CLIENT_SECRET }}
      TF_VAR_jimm_url: ${{ secrets.JIMM_URL }}
      TF_VAR_jimm_client_id: ${{ secrets.JIMM_CLIENT_ID }}
      TF_VAR_jimm_client_secret: ${{ secrets.JIMM_CLIENT_SECRET }}
      ROW: ${{ needs.resolve.outputs.row }}
      MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Install juju
        run: sudo snap install juju --channel=3.6/stable
      - name: Toolchain check
        run: JUJU_LANE=1 make dev-check
      - name: Enforce the attach-apply opt-in
        if: env.MODE == 'attach-apply'
        env:
          ALLOW: ${{ vars.ALLOW_ATTACH_APPLY }}
        run: |
          if [ "$ALLOW" != "true" ]; then
            echo "::error::attach-apply is disabled here (docs/ci-spec.md §8)"
            exit 1
          fi
      - name: Register JIMM controller
        run: |
          target="${TF_VAR_jimm_url#*://}"
          target="${target%%/*}"
          juju login "$target" -c jimm
      - name: Controller guard self-check
        run: node matrix/controller-guard.mjs --check
      - name: Terraform init
        run: terraform -chdir=matrix/backends/juju/root init -input=false
      - name: Drift gate
        run: |
          set -o pipefail
          if [ "$MODE" = "attach-apply" ]; then
            make test-matrix-row ROW="$ROW" BACKEND=juju ATTACH=1 2>&1 | tee juju-lane-log.txt
          else
            make test-matrix-row ROW="$ROW" BACKEND=juju ATTACH=1 PLAN_ONLY=1 2>&1 | tee juju-lane-log.txt
          fi
      - name: Summarize drift
        if: always()
        env:
          ENV_NAME: ${{ needs.resolve.outputs.environment }}
        run: |
          {
            echo "## Drift gate: $ENV_NAME / row $ROW ($MODE)"
            echo '```'
            grep -E '^(Plan:|No changes|  # )|relation transition|drift gate|✗' juju-lane-log.txt || true
            echo '```'
            if [ -f matrix/backends/juju/root/attach.tfvars.json ]; then
              echo '### Deployed charm revisions (discovered)'
              echo '```json'
              jq .charm_revisions matrix/backends/juju/root/attach.tfvars.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lane log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # log only — terraform state is secret-bearing and never leaves the runner
          name: juju-lane-log
          path: juju-lane-log.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Scrub attach artifacts
        if: always()
        run: |
          rm -rf matrix/backends/juju/root/terraform.tfstate.d
          rm -f matrix/backends/juju/root/attach.tfvars.json matrix/backends/juju/root/imports.attach.tf.json

  triage:
    needs: [resolve, drift]
    if: always() && needs.drift.result != 'cancelled' && github.event_name == 'schedule'
    uses: ./.github/workflows/_triage.yml
    with:
      lane: juju drift gate (${{ needs.resolve.outputs.environment }})
      label: ci-juju-${{ needs.resolve.outputs.environment }}
      artifact: juju-lane-log
      outcome: ${{ needs.drift.result }}
    secrets: inherit

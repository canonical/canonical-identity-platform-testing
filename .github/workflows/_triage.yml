# Reusable lane triage — design: docs/ci-spec.md §6. One deduplicated issue
# per lane label; closes it on green; never re-runs anything.
name: Triage

on:
  workflow_call:
    inputs:
      lane:
        description: Human-readable lane name (issue title/body)
        type: string
        required: true
      label:
        description: Issue label that identifies this lane (dedup key)
        type: string
        required: true
      artifact:
        description: Name of the uploaded artifact containing the lane log
        type: string
        required: true
      outcome:
        description: Result of the tested job (needs.<job>.result)
        type: string
        required: true
      dry_run:
        description: Run the triage and print it to the job summary WITHOUT filing, commenting or closing any issue (triage-smoke.yml)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LANE: ${{ inputs.lane }}
      LABEL: ${{ inputs.label }}
      OUTCOME: ${{ inputs.outcome }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download lane log
        if: env.OUTCOME == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: lane-log
      - name: Build log excerpt
        if: env.OUTCOME == 'failure'
        run: |
          find lane-log -type f \( -name '*.txt' -o -name '*.log' \) -exec cat {} + > full-log.txt || true
          # tail: verdicts live at the end; 100 KiB bounds the LLM request
          tail -c 102400 full-log.txt > excerpt.txt
          [ -s excerpt.txt ] || echo "(lane produced no log output)" > excerpt.txt
      - name: LLM triage (optional)
        id: llm
        if: env.OUTCOME == 'failure'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.CI_TRIAGE_MODEL || 'google/gemini-3.7-flash' }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            {
              echo "_No OPENROUTER_API_KEY provisioned — verbatim log tail instead of LLM triage._"
              echo '```'
              tail -n 120 excerpt.txt
              echo '```'
            } > triage.md
            echo "source=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat > system.txt <<'EOF'
          You triage failed CI runs of the Canonical Identity Platform test plane.
          The lanes are non-blocking detectors: a red row is a named finding, never noise to suppress.
          From the log excerpt, produce a short markdown report:
          1. One-line verdict per failing row or step.
          2. Classification for each: product-defect candidate | harness/config defect | infrastructure flake | upstream charm wedge (settle timeout, stuck unit).
          3. Evidence: quote the exact log lines you based each classification on.
          4. One concrete next diagnostic step per failure.
          Diagnostic steps must be READ-ONLY: juju debug-log / show-status-log, container logs, config dumps.
          Never recommend `juju resolved`, config kicks, test retries, or any mutation of the deployment — a stuck unit or settle timeout is upstream-bug evidence (decision D-3), and this platform bans absorbing flakes with retries.
          Never speculate beyond the log; if evidence is insufficient, say exactly that.
          Keep it under 400 words.
          EOF
          jq -n --rawfile log excerpt.txt --rawfile system system.txt \
                --arg model "$MODEL" --arg lane "$LANE" \
                '{model: $model, max_tokens: 1500,
                  messages: [{role: "system", content: $system},
                             {role: "user",
                              content: ("Lane: " + $lane + "\n\nLog excerpt (tail):\n\n" + $log)}]}' \
                > request.json
          if curl -sS --max-time 180 --retry 2 https://openrouter.ai/api/v1/chat/completions \
               -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
               -H "content-type: application/json" \
               -d @request.json > response.json; then
            jq -r '.choices[0].message.content // empty' response.json > triage.md || true
          fi
          if [ -s triage.md ]; then
            echo "source=llm" >> "$GITHUB_OUTPUT"
          else
            echo "source=fallback" >> "$GITHUB_OUTPUT"
            echo "OpenRouter answered without usable content:" >&2
            jq -c '.error // {status: "no choices"}' response.json >&2 || true
            {
              echo "_LLM triage unavailable for this run — verbatim log tail._"
              echo '```'
              tail -n 120 excerpt.txt
              echo '```'
            } > triage.md
          fi
      # Smoke mode: the triage IS the deliverable. A fallback here means the
      # key or the model is broken and the next real failure would go out
      # untriaged — fail so the dispatcher sees it.
      - name: Dry run — publish the triage, file nothing
        if: env.OUTCOME == 'failure' && env.DRY_RUN == 'true'
        env:
          SOURCE: ${{ steps.llm.outputs.source }}
        run: |
          {
            echo "### $LANE — triage dry run (source: $SOURCE)"
            echo
            cat triage.md
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$SOURCE" = "llm" ] || { echo "::error::LLM triage did not run (source=$SOURCE)"; exit 1; }
      - name: File or update the lane issue
        if: env.OUTCOME == 'failure' && env.DRY_RUN != 'true'
        run: |
          gh label create "$LABEL" --force --color D93F0B \
            --description "Automated triage for the '$LANE' lane" || true
          {
            echo "### $LANE failed"
            echo
            echo "Run: $RUN_URL"
            echo
            cat triage.md
            echo
            echo "---"
            echo "_Filed automatically. The triage above may be LLM-generated: verify every claim against the run artifacts before acting on it._"
          } > body.md
          num="$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file body.md
          else
            gh issue create --title "[ci] $LANE failing" --label "$LABEL" --body-file body.md
          fi
      - name: Close the lane issue on green
        if: env.OUTCOME == 'success' && env.DRY_RUN != 'true'
        run: |
          num="$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            echo "Lane is green again: $RUN_URL" | gh issue comment "$num" --body-file -
            gh issue close "$num"
          fi

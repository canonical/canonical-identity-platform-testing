version: v1.1.0

oauth2_provider:
  url: "http://hydra:4445"

dsn: postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

log:
  level: debug
  format: text
  leak_sensitive_values: true

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  allowed_return_urls:
    - http://localhost/ui
  # /ui/ is not served by login-ui (it registers /ui/* only, and the extensionless
  # rewrite looks for a non-existent /.html), so a flow falling back to it 404s.
  # The charm lands post-flow browsers on the settings page instead.
  default_browser_return_url: http://localhost/ui/manage_details
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
    totp:
      enabled: true
      config:
        issuer: Identity Platform
    lookup_secret:
      enabled: true
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: localhost
          origins:
            - http://localhost
          display_name: Canonical
    code:
      enabled: true
      config:
        lifespan: 15m
  flows:
    error:
      ui_url: http://localhost/ui/error
    login:
      ui_url: http://localhost/ui/login
      style: identifier_first
    settings:
      # login-ui ships no /ui/settings page — it 404s on the released image.
      # The settings-flow password form lives at /ui/reset_password, which
      # loads the flow from ?flow=<id> via getSettingsFlow(). Kratos redirects
      # here after a valid recovery code, so this must name a page that exists.
      ui_url: http://localhost/ui/reset_password
    registration:
      enabled: true
      ui_url: http://localhost/ui/register
      # Kratos' built-in verifier hook creates the verification flow and mails
      # the code, but only STASHES the hand-off in the flow's internal context.
      # The `show_verification_ui` hook is what surfaces it as a continue_with,
      # and `session` is what issues a session. Without them, registration
      # completes with neither, and the browser falls back to
      # default_browser_return_url. Hooks must be repeated per method: any
      # per-method block overrides a global `after.hooks`. Mirrors
      # kratos-operator/templates/kratos.yaml.j2.
      after:
        password:
          hooks:
            - hook: show_verification_ui
            - hook: session
        oidc:
          hooks:
            - hook: session
        webauthn:
          hooks:
            - hook: session
        code:
          hooks:
            - hook: show_verification_ui
            - hook: session
    recovery:
      enabled: true
      ui_url: http://localhost/ui/reset_email
      use: code
    verification:
      enabled: true
      ui_url: http://localhost/ui/verification
      use: code

courier:
  smtp:
    connection_uri: smtps://mailslurper:1025/?skip_ssl_verify=true

session:
  whoami:
    required_aal: highest_available

selfservice:
  methods:
    oidc:
      enabled: true
      config:
        providers:
          - id: dex
            provider: generic
            issuer_url: http://dex:5556/dex
            client_id: kratos
            client_secret: dex-client-secret
            mapper_url: file:///etc/config/kratos/kratos.dex.jsonnet
            scope:
              - openid
              - profile
              - email
              - offline_access

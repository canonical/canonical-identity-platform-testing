selfservice:
  methods:
    oidc:
      enabled: true
      config:
        providers:
          - id: dex
            provider: generic
            issuer_url: http://dex:5556/dex
            client_id: kratos
            client_secret: dex-client-secret
            mapper_url: file:///etc/config/kratos/kratos.dex.jsonnet
            scope:
              - openid
              - profile
              - email
              - offline_access
          # Placeholder credentials: the suite asserts the provider SET only;
          # google journeys are credential-gated. Substitute real ones locally, never commit.
          - id: google
            provider: google
            client_id: 000000000000-placeholder.apps.googleusercontent.com
            client_secret: GOCSPX-placeholder
            mapper_url: file:///etc/config/kratos/kratos.google.jsonnet
            scope:
              - openid
              - profile
              - email

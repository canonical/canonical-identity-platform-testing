http:
  middlewares:
    sidecar-replace-path-regex-login-ui:
      replacePathRegex:
        regex: "^/self-service/(.*)"
        replacement: "/api/kratos/self-service/$1"
    replace-webauthn-path:
      replacePath:
        path: "/.well-known/ory/webauthn.js"

  routers:
    # ── Kratos direct routes (bypass login-ui proxy) ──────────────────────

    # OIDC callback: Kratos manages its CSRF/session cookies natively; the login-ui proxy breaks it.
    kratos-oidc-callback:
      entryPoints:
        - web
      rule: "PathPrefix(`/self-service/methods/oidc/callback`)"
      service: kratos-public-svc
      priority: 300

    # WebAuthn helper script, served by Kratos at /.well-known/ory/webauthn.js.
    kratos-webauthn-js:
      entryPoints:
        - web
      rule: "Path(`/.well-known/webauthn.js`)"
      service: kratos-public-svc
      priority: 300
      middlewares:
        - replace-webauthn-path

    # Identity JSON schemas — served directly by Kratos.
    kratos-schemas:
      entryPoints:
        - web
      rule: "PathPrefix(`/schemas`)"
      service: kratos-public-svc
      priority: 300

    # ── Login-UI proxied routes ───────────────────────────────────────────

    # Identifier-first step is handled by the login-ui Go proxy; outranks kratos-self-service.
    login-ui-id-first:
      entryPoints:
        - web
      rule: "Path(`/self-service/login/id-first`)"
      service: login-ui-svc
      priority: 200
      middlewares:
        - sidecar-replace-path-regex-login-ui

    # Self-service through the login-ui proxy (CSRF cookies); the OIDC callback is excluded above.
    kratos-self-service:
      entryPoints:
        - web
      rule: "PathPrefix(`/self-service`)"
      service: login-ui-svc
      priority: 100
      middlewares:
        - sidecar-replace-path-regex-login-ui

    # Hydra API endpoints
    login-ui-api-hydra:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/hydra`)"
      service: login-ui-svc

    # login-ui v0.28.0 registers exactly PUT /api/device
    # (canonical/identity-platform-login-ui@197703c9 pkg/web/router.go:187); /api/hydra does not cover it.
    login-ui-api-device:
      entryPoints:
        - web
      rule: "Path(`/api/device`)"
      service: login-ui-svc

    # Hydra consent endpoint
    login-ui-api-consent:
      entryPoints:
        - web
      rule: "Path(`/api/consent`)"
      service: login-ui-svc

    # App config API
    login-ui-api-config:
      entryPoints:
        - web
      rule: "Path(`/api/v0/app-config`)"
      service: login-ui-svc

    # Exactly `/api/v0/tenants` is login-ui's; `/api/v0/tenants/lookup` (called
    # server-side by login-ui) is tenant-service's. Its docker-provider router
    # claims the whole prefix, so an explicit priority splits the two.
    login-ui-api-tenants:
      entryPoints:
        - web
      rule: "Path(`/api/v0/tenants`)"
      priority: 200
      service: login-ui-svc

    # Tenant selection API
    login-ui-api-auth-tenant:
      entryPoints:
        - web
      rule: "Path(`/api/v0/auth/tenant`)"
      service: login-ui-svc

    # UI pages
    login-ui-ui:
      entryPoints:
        - web
      rule: "PathPrefix(`/ui`)"
      service: login-ui-svc

  services:
    kratos-public-svc:
      loadBalancer:
        servers:
          - url: "http://kratos:4433"

    login-ui-svc:
      loadBalancer:
        servers:
          - url: "http://login-ui:4455"

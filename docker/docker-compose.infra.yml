services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - intranet
    labels:
      - "traefik.enable=false"

  openfga-migrate:
    image: openfga/openfga:v1.12.0
    command: migrate --datastore-engine postgres --datastore-uri 'postgresql://openfga:openfga@postgres:5432/openfga?sslmode=disable'
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - intranet
    labels:
      - "traefik.enable=false"

  openfga:
    image: openfga/openfga:v1.12.0
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: "postgres"
      OPENFGA_DATASTORE_URI: "postgresql://openfga:openfga@postgres:5432/openfga?sslmode=disable"
      OPENFGA_AUTHN_METHOD: "preshared"
      OPENFGA_AUTHN_PRESHARED_KEYS: "42"
    command: run
    ports:
      - "8180:8080"
      - "8181:8081"
      - "3001:3000"
    restart: unless-stopped
    # No healthcheck: upstream openfga image is distroless (no pebble) and we
    # don't want to commit to a probe before the image is swapped for a rock.
    # Tracked separately; revisit once the openfga rock lands.
    networks:
      - intranet
    labels:
      - "traefik.enable=false"

  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - intranet

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436"
      - "4437:4437"
    restart: unless-stopped
    # No healthcheck: image lacks a usable probe (no curl/wget/nc/pebble) and
    # mailslurper isn't on any service's dependency chain. See change
    # add-container-healthchecks design decision 5.
    networks:
      - intranet
    labels:
      - "traefik.enable=false"

  oidc-consumer:
    image: ghcr.io/canonical/hydra:25.4.0
    command: exec hydra perform authorization-code --no-open --no-shutdown --client-id browser-test-rp --client-secret browser-test-rp-secret --endpoint http://hydra:4444 --scope openid,profile,email,offline_access --auth-url http://localhost:4444/oauth2/auth
    ports:
      - "4446:4446"
    depends_on:
      hydra:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - intranet
    labels:
      - "traefik.enable=false"

volumes:
  postgres-data:

networks:
  intranet:
    driver: bridge

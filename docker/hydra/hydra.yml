serve:
  cookies:
    same_site_mode: Lax
  admin:
    cors:
      enabled: true
      allowed_origins:
        - "*"
  public:
    cors:
      enabled: true
      allowed_origins:
        - "*"

log:
  leak_sensitive_values: true
  level: debug

oauth2:
  expose_internal_errors: true
  device_authorization:
    # Polling interval for non-interactive devices (matches the reference:
    # identity-platform-login-ui@ab24edd2bc5a docker/hydra/hydra.yml).
    token_polling_interval: 5s
  # The token hook is set per-row via OAUTH2_TOKEN_HOOK_* on the hydra service:
  # hydra fails token issuance outright when the hook is unreachable, and this
  # file is shared by rows that scale hook-service to 0.

strategies:
  access_token: jwt
  jwt:
    scope_claim: list
  scope: exact

urls:
  self:
    issuer: http://localhost:4444
    public: http://localhost:4444
  consent: http://localhost/ui/consent
  login: http://localhost/ui/login
  device:
    verification: http://localhost/ui/device_code
    success: http://localhost/ui/device_complete
  error: http://localhost/ui/oidc_error

secrets:
  system:
    # Throwaway local-stack secret: this compose stack is never exposed beyond localhost.
    - youReallyNeedToChangeThis
